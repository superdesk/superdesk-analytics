name: "CI"

on: [push, pull_request]

jobs:
  server:
    env:
      ELASTIC_CLIENT_APIVERSIONING: 1
      SERVER: true
      OPENSSL_CONF: /dev/null  # fixes phantomjs error

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.12'
            elastic: '7.17.29'
            node-version: '22'
          - os: ubuntu-24.04
            python-version: '3.12'
            elastic: '8.19.6'
            node-version: '22'

    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - "6379:6379"

      mongo:
        image: mongo:6
        ports:
          - "27017:27017"

      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elastic }}
        ports:
          - "9200:9200"
        env:
          discovery.type: single-node
          xpack.security.enabled: false

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Environment
        run: ./scripts/ci-install.sh
      - name: Pytest
        run: pytest --log-level=ERROR --disable-warnings
      - name: Behave
        working-directory: ./server
        run: behave --format progress2 --logging-level=ERROR features

  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run hint
      - name: Unit Tests
        run: npm run unit_test
